
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma carte personnelle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="carte">

        <h1>Ma présentation</h1>

        <p>
            Je construis mon avenir grâce au développement web.
        </p>

        <h2>Mes compétences</h2>

        <ul class="compétences">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <h2>Mes projets</h2>

<div class="grille">
    <div>Mon portfolio</div>
    <div>Mon site projet</div>
    <div>Mon premier quiz</div>
</div>

        <h2>Me contacter</h2>

        <form>
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" placeholder="Ton nom" required>

            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" placeholder="Ton adresse e-mail" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Ton message" required></textarea>

            <button type="submit">Envoyer</button>
        </form>

    </main>

</body>
</html>
