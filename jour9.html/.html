<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma liste de tâches</title>
    <style>

    body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        text-align: center;
        padding: 30px;
    }

    h1 {
        color: #243b55;
    }

    input {
        padding: 12px;
        width: 220px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        padding: 10px;
        margin: 5px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background-color: #2563eb;
        color: white;
    }

    li {
        background-color: white;
        padding: 12px;
        margin: 10px auto;
        border-radius: 8px;
        list-style: none;
        max-width: 450px;
    }
</style>
</head>
<body>

    <h1>Ma liste de tâches</h1>

    <p id="statistiques">Chargement...</p>

    <input type="text" id="tache" placeholder="Écris une tâche">

    <button id="ajouter">Ajouter</button>

    <ul id="liste"></ul>

<script>
    
    let champ = document.getElementById("tache");
let bouton = document.getElementById("ajouter");
let liste = document.getElementById("liste");

// Récupérer les tâches sauvegardées
let taches = JSON.parse(localStorage.getItem("tachesJour10")) || [];

function afficherStatistiques() {
    let total = taches.length;

    let terminees = taches.filter(function(tache) {
        return tache.terminee === true;
    }).length;

    document.getElementById("statistiques").textContent =
        "Total : " + total + " | Terminées : " + terminees;
}

function afficherTaches() {
    liste.innerHTML = "";

    if (taches.length === 0) {
    liste.textContent = "Aucune tâche pour le moment.";
}

    taches.forEach(function(tache, index) {
        let nouvelleTache = document.createElement("li");

        nouvelleTache.textContent = tache.texte + " ";

        if (tache.terminee) {
            nouvelleTache.style.textDecoration = "line-through";
        }

        let boutonTerminer = document.createElement("button");
        boutonTerminer.textContent = tache.terminee ? "Annuler" : "Terminer";

        boutonTerminer.addEventListener("click", function() {
            taches[index].terminee = !taches[index].terminee;
            sauvegarderTaches();
        });

        let boutonSupprimer = document.createElement("button");
        boutonSupprimer.textContent = "Supprimer";

        boutonSupprimer.addEventListener("click", function() {
            taches.splice(index, 1);
            sauvegarderTaches();
        });

        nouvelleTache.appendChild(boutonTerminer);
        nouvelleTache.appendChild(boutonSupprimer);

        liste.appendChild(nouvelleTache);
    });
}

function sauvegarderTaches() {
    localStorage.setItem("tachesJour10", JSON.stringify(taches));
    afficherTaches();
    afficherStatistiques();
}

bouton.addEventListener("click", function() {
    let texte = champ.value.trim();

    if (texte !== "") {
        taches.push({
            texte: texte,
            terminee: false
        });

        champ.value = "";
        sauvegarderTaches();
    }
});

afficherTaches();
afficherStatistiques();


</script>
</body>
</html>
