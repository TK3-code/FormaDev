
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma première calculatrice</title>
</head>
<body>

    <h1>Ma calculatrice</h1>

    <label for="nombre1">Premier nombre :</label>
    <input type="number" id="nombre1">

    <br><br>

    <label for="nombre2">Deuxième nombre :</label>
    <input type="number" id="nombre2">

    <br><br>

    <button onclick="calculer('+')">Addition +</button>
    <button onclick="calculer('-')">Soustraction -</button>
    <button onclick="calculer('*')">Multiplication ×</button>
    <button onclick="calculer('/')">Division ÷</button>

    <h2>Résultat :</h2>
    <p id="resultat">Le résultat apparaîtra ici.</p>

    <script>
        function calculer(operation) {

            let nombre1 = document.getElementById("nombre1").value;
            let nombre2 = document.getElementById("nombre2").value;

            if (nombre1 === "" || nombre2 === "") {
                document.getElementById("resultat").textContent =
                    "Veuillez saisir les deux nombres.";
                return;
            }

            nombre1 = Number(nombre1);
            nombre2 = Number(nombre2);

            let resultat;

            if (operation === "+") {
                resultat = nombre1 + nombre2;
            } else if (operation === "-") {
                resultat = nombre1 - nombre2;
            } else if (operation === "*") {
                resultat = nombre1 * nombre2;
            } else if (operation === "/") {

                if (nombre2 === 0) {
                    document.getElementById("resultat").textContent =
                        "Impossible de diviser par zéro.";
                    return;
                }

                resultat = nombre1 / nombre2;
            }

            document.getElementById("resultat").textContent =
                "Résultat : " + resultat;
        }
    </script>

</body>
</html>
